<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Quirky Deck | Portfolio Project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --card-width: 320px;
            --card-height: 448px;
            --bg-dark: #0f172a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: radial-gradient(circle at 20% 20%, #1e293b 0%, transparent 40%),
                        radial-gradient(circle at 80% 80%, #334155 0%, transparent 40%),
                        #0f172a;
        }

        /* --- THE PLAYING CARD --- */
        .card-wrapper {
            perspective: 1000px;
            margin-bottom: 3rem;
        }

        .playing-card {
            width: var(--card-width);
            height: var(--card-height);
            background: #ffffff;
            border-radius: 18px;
            position: relative;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 0 0 8px #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden;
        }

        .playing-card:hover {
            transform: translateY(-10px) rotateX(5deg);
        }

        .corner-symbol {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.4s ease;
        }

        .top-right { top: 15px; right: 15px; }
        .bottom-left { bottom: 15px; left: 15px; transform: rotate(180deg); }

        .content-area {
            text-align: center;
            z-index: 2;
            width: 100%;
        }

        .main-text {
            font-family: 'Space Mono', monospace;
            font-size: 1.15rem;
            color: #1e293b;
            line-height: 1.5;
            transition: opacity 0.3s ease;
        }

        .punchline {
            display: block;
            margin-top: 1.5rem;
            color: #6366f1;
            font-weight: 800;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .punchline.reveal {
            opacity: 1;
            transform: scale(1);
        }

        /* --- CONTROLS --- */
        .button-group {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
        }

        .btn-compliment { background: #6366f1; color: white; box-shadow: 0 8px 15px rgba(99, 102, 241, 0.3); }
        .btn-joke { background: #f43f5e; color: white; box-shadow: 0 8px 15px rgba(244, 63, 94, 0.3); }

        .btn:hover { transform: translateY(-3px); filter: brightness(1.1); }
        .btn:active { transform: translateY(0); }

    </style>
</head>
<body>

    <div class="card-wrapper">
        <div class="playing-card" id="card">
            <div class="corner-symbol top-right" id="tr-symbol">✨</div>
            <div class="corner-symbol bottom-left" id="bl-symbol">✨</div>
            
            <div class="content-area">
                <p id="display-text" class="main-text">Deal a card to find your vibe.</p>
                <span id="punchline-text" class="punchline"></span>
            </div>
        </div>
    </div>

    <div class="button-group">
        <button class="btn btn-compliment" onclick="handleCompliment()">Quirky Compliment</button>

            const symbol = symbols[Math.floor(Math.random() * symbols.length)];
            
            [trEl, blEl].forEach(el => {
                el.style.backgroundColor = color + '22';

                displayEl.innerText = compliment;

            }, 300);

        function handleJoke() {
