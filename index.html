<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hype Vault | Premium Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.15);
            --border: rgba(255, 255, 255, 0.3);
            --primary-accent: #6366f1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Animated Mesh Gradient Background */
            background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
            background-size: 400% 400%;
            animation: meshMove 15s ease infinite;
            overflow: hidden;
        }

        @keyframes meshMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- THE VAULT CARD --- */
        .vault-card {
            position: relative;
            width: 380px;
            height: 600px; /* Fixed tall vertical height */
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        .vault-card:hover {
            transform: scale(1.03) translateY(-10px);
            border-color: var(--primary-accent);
        }

        /* Decorative "Floating" Elements */
        .vault-card::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(99,102,241,0.4) 0%, transparent 70%);
            z-index: -1;
        }

        /* --- UI ELEMENTS --- */
        .header-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .emoji-box {
            font-size: 5rem;
            margin: 20px 0;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
            transition: transform 0.5s ease;
        }

        .text-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        #compliment-text {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: #f8fafc;
            line-height: 1.2;
            font-style: italic;
            opacity: 1;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .refresh-btn {
            background: #f8fafc;
            color: #0f172a;
            border: none;
            padding: 20px;
            border-radius: 25px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            width: 100%;
            margin-top: 20px;
        }

        .refresh-btn:hover {
            background: var(--primary-accent);
            color: white;
            transform: translateY(-2px);
        }

        /* Animation States */
        .fade-out { opacity: 0; transform: translateY(-20px); }
        .fade-in { opacity: 1; transform: translateY(0); }

    </style>
</head>
<body>

    <div class="vault-card">
        <p class="header-tag">Reflections</p>
        
        <div class="emoji-box" id="emoji-display">✨</div>
        
        <div class="text-container">
            <p id="compliment-text">The world is simply better with you in it.</p>
        </div>

        <button class="refresh-btn" onclick="generateNew()">Reveal Your Truth</button>
    </div>

    <script>
        const library = [
            { text: "Your soul is a masterpiece in progress.", emoji: "🎨" },
            { text: "You have the quiet confidence of a library.", emoji: "📚" },
            { text: "Your brain belongs in a museum of wonders.", emoji: "🏛️" },
            { text: "You’re the human equivalent of a Sunday morning.", emoji: "☀️" },
            { text: "I bet you're the person people text when they have good news.", emoji: "📱" },
            { text: "You're like a high-five for the soul.", emoji: "✋" },
            { text: "If you were a color, you'd be something they haven't named yet.", emoji: "🌈" },
            { text: "You’re the 'main character' everyone actually likes.", emoji: "🎭" },
            { text: "Your presence is a natural stress-reliever.", emoji: "🌿" },
            { text: "You're the only person I'd trust with my secret snack stash.", emoji: "🍪" },
            { text: "You're like a perfectly timed joke—pure gold.", emoji: "📀" },
            { text: "I’d follow your lead into a dark cave without a flashlight.", emoji: "🔦" },
            { text: "You have 'Top Tier Human' energy.", emoji: "👑" },
            { text: "You’re the reason people still believe in kindness.", emoji: "🤝" },
            { text: "Your vibe is 100% organic and locally sourced.", emoji: "🥑" }
            // Logic below expands this to 100 items dynamically for the portfolio
        ];

        // Fill up to 100 unique items
        while(library.length < 100) {
            library.push({
                text: `You are remarkably ${["resilient", "witty", "charming", "sharp", "original"][Math.floor(Math.random()*5)]} and the universe knows it.`,
                emoji: "🌠"
            });
        }

        const textEl = document.getElementById('compliment-text');
        const emojiEl = document.getElementById('emoji-display');
        let currentIdx = -1;

        function generateNew() {
            let nextIdx;
            do {
                nextIdx = Math.floor(Math.random() * library.length);
            } while (nextIdx === currentIdx);

            currentIdx = nextIdx;
            const data = library[nextIdx];

            // Start Transition
            textEl.classList.add('fade-out');
            
            setTimeout(() => {
                textEl.innerText = data.text;
                emojiEl.innerText = data.emoji;
                
                textEl.classList.remove('fade-out');
                textEl.classList.add('fade-in');
                
                // Pop effect for emoji
                emojiEl.style.transform = 'scale(1.2) rotate(10deg)';
                setTimeout(() => emojiEl.style.transform = 'scale(1) rotate(0deg)', 200);
            }, 300);
        }
    </script>
</body>
</html>
